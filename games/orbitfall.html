<title>Orbitfall</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --void:#120C1E;
    --nebula:#251739;
    --violet:#7B5CFF;
    --violet-soft:#B79CFF;
    --rose:#FF5D73;
    --gold:#F5D06F;
    --mint:#5FE3C0;
    --ink:#EDE6FA;
    --ink-dim:#9A8CB8;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--void);
    color:var(--ink);
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  .hud{
    position:fixed;inset:0;
    pointer-events:none;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 18px) calc(env(safe-area-inset-right) + 20px)
            calc(env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-left) + 20px);
  }
  .bar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .stat{display:flex;flex-direction:column;gap:4px}
  .stat.right{align-items:flex-end}
  .label{
    font-size:10px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ink-dim);
  }
  .value{
    font-size:26px;font-weight:600;line-height:1;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
  }
  .stat.right .value{color:var(--gold);font-size:18px;padding-top:5px}

  .combo{
    align-self:center;margin-top:auto;margin-bottom:8px;
    font-size:15px;font-weight:600;letter-spacing:.12em;color:var(--mint);
    opacity:0;transition:opacity .18s ease;
    font-variant-numeric:tabular-nums;
  }
  .combo.on{opacity:1}

  .panel{
    position:fixed;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:32px;text-align:center;
    background:radial-gradient(120% 80% at 50% 50%, rgba(18,12,30,.72) 0%, rgba(18,12,30,.94) 70%);
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .panel[hidden]{display:none}
  .eyebrow{
    font-size:10px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--violet-soft);
  }
  h1{
    font-family:Syne,"Trebuchet MS",sans-serif;font-weight:800;
    font-size:clamp(40px,13vw,68px);line-height:.92;letter-spacing:.02em;
    margin:0;text-wrap:balance;
    background:linear-gradient(150deg,var(--gold) 0%,var(--rose) 48%,var(--violet-soft) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .rule{width:44px;height:2px;background:var(--violet);opacity:.7;border-radius:2px}
  .lede{max-width:22ch;font-size:14px;line-height:1.6;color:var(--ink-dim);margin:0}
  .lede b{color:var(--ink);font-weight:500}
  .final{
    font-family:Syne,sans-serif;font-weight:800;font-size:clamp(52px,18vw,88px);
    line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;margin:2px 0;
  }
  .sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
  .sub b{color:var(--gold);font-weight:600}
  .prompt{
    margin-top:10px;font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink);animation:breathe 1.9s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    .prompt{animation:none;opacity:.8}
    .panel,.combo{transition:none}
  }
</style>

<div id="stage"><canvas id="game"></canvas></div>

<div class="hud">
  <div class="bar">
    <div class="stat"><span class="label">Punkte</span><span class="value" id="score">0</span></div>
    <div class="stat right"><span class="label">Bestwert</span><span class="value" id="best">0</span></div>
  </div>
  <div class="combo" id="combo">&times;2</div>
</div>

<div class="panel" id="menu">
  <span class="eyebrow">Ein Daumen genügt</span>
  <h1>Orbitfall</h1>
  <div class="rule"></div>
  <p class="lede">Du kreist um den Stern. <b>Tippen dreht deine Richtung um.</b> Triff die Lücke im Ring, sammle die grünen Funken.</p>
  <span class="prompt">Tippen zum Starten</span>
</div>

<div class="panel" id="over" hidden>
  <span class="eyebrow">Lauf beendet</span>
  <div class="final" id="finalScore">0</div>
  <div class="sub">Ringe: <b id="finalRings">0</b> &nbsp;·&nbsp; Best: <b id="finalBest">0</b></div>
  <span class="prompt">Tippen für neuen Versuch</span>
</div>

<script>
(() => {
  "use strict";
  const cv = document.getElementById("game");
  const ctx = cv.getContext("2d");
  const el = {
    score: document.getElementById("score"),
    best: document.getElementById("best"),
    combo: document.getElementById("combo"),
    menu: document.getElementById("menu"),
    over: document.getElementById("over"),
    finalScore: document.getElementById("finalScore"),
    finalRings: document.getElementById("finalRings"),
    finalBest: document.getElementById("finalBest")
  };
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const angDiff = (a, b) => { let d = Math.abs(a - b) % TAU; return d > Math.PI ? TAU - d : d; };

  let W = 0, H = 0, cx = 0, cy = 0, orbitR = 120, playerR = 9, thick = 14, spawnR = 500;
  let stars = [];

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; cy = H * 0.52;
    orbitR = Math.max(70, Math.min(W * 0.30, H * 0.24));
    playerR = Math.max(7, orbitR * 0.085);
    thick = Math.max(10, orbitR * 0.13);
    spawnR = Math.hypot(W, H) * 0.56 + orbitR;
    if (!stars.length) {
      for (let i = 0; i < 90; i++) {
        stars.push({ a: rnd(0, TAU), d: rnd(0.12, 1.15), s: rnd(0.5, 1.6), p: rnd(0, TAU) });
      }
    }
  }

  let best = 0;
  try { best = parseInt(localStorage.getItem("orbitfall.best") || "0", 10) || 0; } catch (e) {}
  el.best.textContent = best;

  let state = "menu";
  let score = 0, rings = 0, level = 0;
  let ang = -Math.PI / 2, dir = 1, angSpd = 2.0;
  let gates = [], sparks = [], parts = [], trail = [];
  let spawnT = 0, sparkT = 0, combo = 1, comboT = 0, shake = 0, deadT = 0, flash = 0, time = 0;

  function reset() {
    score = 0; rings = 0; level = 0;
    ang = -Math.PI / 2; dir = 1; angSpd = 2.0;
    gates = []; sparks = []; parts = []; trail = [];
    spawnT = 0.35; sparkT = 1.0; combo = 1; comboT = 0; shake = 0; deadT = 0; flash = 0;
    el.score.textContent = "0";
    el.combo.classList.remove("on");
  }

  function spawnGate() {
    const gapCount = level > 10 && Math.random() < 0.35 ? 2 : 1;
    const v = orbitR * (1.05 + level * 0.035);
    // Keep every gate physically passable: the gap must stay wider than the arc
    // the player sweeps while the ring crosses the orbit band.
    const band = thick / 2 + playerR;
    const sweep = (angSpd * (2 * band / v)) / 2;
    const margin = Math.max(0.13, 0.34 - level * 0.006);
    const hw = sweep + (playerR / orbitR) * 0.6 + margin;
    const gaps = [];
    const base = rnd(0, TAU);
    for (let i = 0; i < gapCount; i++) gaps.push({ c: base + (i * TAU) / gapCount, hw: hw });
    gates.push({
      r: spawnR,
      v: v,
      gaps: gaps,
      rot: 0,
      spin: level > 5 ? (Math.random() < 0.5 ? -1 : 1) * (0.1 + level * 0.012) : 0,
      passed: false,
      fade: 1
    });
  }

  function spawnSpark() {
    sparks.push({ a: ang + dir * rnd(1.1, 2.6), life: 4.2, t: 0 });
  }

  function burst(x, y, color, n, power) {
    const count = reduced ? Math.ceil(n / 2) : n;
    for (let i = 0; i < count; i++) {
      const a = rnd(0, TAU), sp = rnd(0.2, 1) * power;
      parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.35, 0.9), t: 0, c: color, r: rnd(1.2, 3) });
    }
  }

  function die() {
    if (state !== "play") return;
    state = "dead"; deadT = 0; trail = [];
    shake = reduced ? 0 : 20;
    const px = cx + Math.cos(ang) * orbitR, py = cy + Math.sin(ang) * orbitR;
    burst(px, py, "255,93,115", 34, 320);
    if (score > best) {
      best = score;
      try { localStorage.setItem("orbitfall.best", String(best)); } catch (e) {}
      el.best.textContent = best;
    }
    el.finalScore.textContent = score;
    el.finalRings.textContent = rings;
    el.finalBest.textContent = best;
    el.combo.classList.remove("on");
    setTimeout(() => { if (state === "dead") el.over.hidden = false; }, 520);
  }

  function tap() {
    if (state === "menu") {
      el.menu.hidden = true; reset(); state = "play"; return;
    }
    if (state === "dead") {
      if (deadT > 0.7) { el.over.hidden = true; reset(); state = "play"; }
      return;
    }
    dir *= -1;
    flash = 1;
    const px = cx + Math.cos(ang) * orbitR, py = cy + Math.sin(ang) * orbitR;
    burst(px, py, "183,156,255", 6, 90);
  }

  function update(dt) {
    time += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 42);
    if (flash > 0) flash = Math.max(0, flash - dt * 3.5);

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.t += dt;
      if (p.t >= p.life) { parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.94; p.vy *= 0.94;
    }

    if (state === "dead") { deadT += dt; return; }
    if (state !== "play") return;

    ang = (ang + dir * angSpd * dt) % TAU;
    trail.push({ a: ang, t: 0 });
    if (trail.length > 16) trail.shift();
    for (const s of trail) s.t += dt;

    if (comboT > 0) { comboT -= dt; if (comboT <= 0) { combo = 1; el.combo.classList.remove("on"); } }

    spawnT -= dt;
    if (spawnT <= 0) { spawnGate(); spawnT = Math.max(0.72, 1.55 - level * 0.04); }

    sparkT -= dt;
    if (sparkT <= 0) { spawnSpark(); sparkT = rnd(1.2, 2.1); }

    const band = thick / 2 + playerR;
    for (let i = gates.length - 1; i >= 0; i--) {
      const g = gates[i];
      g.r -= g.v * dt;
      g.rot += g.spin * dt;
      if (g.r < orbitR * 0.18) { g.fade -= dt * 2.4; if (g.fade <= 0) { gates.splice(i, 1); continue; } }
      if (g.passed) continue;
      if (Math.abs(g.r - orbitR) < band) {
        const slack = (playerR / orbitR) * 0.6;
        let safe = false;
        for (const gap of g.gaps) if (angDiff(ang, gap.c + g.rot) < gap.hw - slack) { safe = true; break; }
        if (!safe) { die(); return; }
      } else if (g.r < orbitR - band) {
        g.passed = true; rings++; level++; score += 10;
        angSpd = Math.min(3.5, 2.0 + level * 0.032);
        el.score.textContent = score;
        const px = cx + Math.cos(ang) * orbitR, py = cy + Math.sin(ang) * orbitR;
        burst(px, py, "123,92,255", 8, 120);
      }
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.t += dt;
      if (s.t >= s.life) { sparks.splice(i, 1); continue; }
      if (angDiff(ang, s.a) < 0.15) {
        score += 5 * combo;
        combo = Math.min(9, combo + 1);
        comboT = 3;
        el.combo.textContent = "×" + combo;
        el.combo.classList.add("on");
        el.score.textContent = score;
        burst(cx + Math.cos(s.a) * orbitR, cy + Math.sin(s.a) * orbitR, "95,227,192", 12, 150);
        sparks.splice(i, 1);
      }
    }
  }

  function draw() {
    ctx.save();
    if (shake > 0.5) ctx.translate(rnd(-shake, shake) * 0.35, rnd(-shake, shake) * 0.35);

    const bg = ctx.createRadialGradient(cx, cy, orbitR * 0.2, cx, cy, Math.max(W, H) * 0.78);
    bg.addColorStop(0, "#2A1A42");
    bg.addColorStop(0.55, "#1A1030");
    bg.addColorStop(1, "#120C1E");
    ctx.fillStyle = bg;
    ctx.fillRect(-40, -40, W + 80, H + 80);

    const spin = time * 0.02;
    const maxD = Math.hypot(W, H) * 0.6;
    for (const s of stars) {
      const a = s.a + spin, d = s.d * maxD;
      const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d;
      ctx.globalAlpha = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(time * 1.4 + s.p));
      ctx.fillStyle = "#C9BBE8";
      ctx.fillRect(x, y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    ctx.setLineDash([2, 9]);
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(183,156,255,0.28)";
    ctx.beginPath(); ctx.arc(cx, cy, orbitR, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);

    for (const s of sparks) {
      const k = Math.min(1, s.t * 4) * Math.min(1, (s.life - s.t) * 1.6);
      const x = cx + Math.cos(s.a) * orbitR, y = cy + Math.sin(s.a) * orbitR;
      const pulse = 1 + 0.18 * Math.sin(time * 7 + s.a * 3);
      ctx.globalAlpha = k;
      ctx.fillStyle = "rgba(95,227,192,0.16)";
      ctx.beginPath(); ctx.arc(x, y, playerR * 1.5 * pulse, 0, TAU); ctx.fill();
      ctx.fillStyle = "#5FE3C0";
      ctx.beginPath(); ctx.arc(x, y, playerR * 0.5 * pulse, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.lineCap = "round";
    for (const g of gates) {
      const gaps = g.gaps.map(x => ({ c: x.c + g.rot, hw: x.hw })).sort((a, b) => a.c - b.c);
      const near = 1 - Math.min(1, Math.abs(g.r - orbitR) / (orbitR * 2));
      ctx.globalAlpha = g.fade * (g.passed ? 0.35 : 1);
      for (let i = 0; i < gaps.length; i++) {
        const from = gaps[i].c + gaps[i].hw;
        const to = (i + 1 < gaps.length ? gaps[i + 1].c : gaps[0].c + TAU) - gaps[(i + 1) % gaps.length].hw;
        ctx.lineWidth = thick + 8;
        ctx.strokeStyle = "rgba(123,92,255," + (0.10 + 0.14 * near) + ")";
        ctx.beginPath(); ctx.arc(cx, cy, g.r, from, to); ctx.stroke();
        ctx.lineWidth = thick;
        ctx.strokeStyle = g.passed ? "#4A3A82" : "#7B5CFF";
        ctx.beginPath(); ctx.arc(cx, cy, g.r, from, to); ctx.stroke();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(183,156,255," + (0.5 + 0.5 * near) + ")";
        ctx.beginPath(); ctx.arc(cx, cy, g.r - thick / 2 + 1, from, to); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    const corePulse = 1 + 0.06 * Math.sin(time * 2.2);
    const coreR = orbitR * 0.2 * corePulse;
    const halo = ctx.createRadialGradient(cx, cy, coreR * 0.3, cx, cy, coreR * 4.2);
    halo.addColorStop(0, "rgba(245,208,111,0.42)");
    halo.addColorStop(1, "rgba(245,208,111,0)");
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cy, coreR * 4.2, 0, TAU); ctx.fill();
    ctx.fillStyle = "#F5D06F";
    ctx.beginPath(); ctx.arc(cx, cy, coreR, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.beginPath(); ctx.arc(cx - coreR * 0.22, cy - coreR * 0.25, coreR * 0.34, 0, TAU); ctx.fill();

    if (state !== "menu") {
      for (let i = 0; i < trail.length; i++) {
        const s = trail[i], k = i / trail.length;
        ctx.globalAlpha = k * 0.4;
        ctx.fillStyle = "#FF5D73";
        ctx.beginPath();
        ctx.arc(cx + Math.cos(s.a) * orbitR, cy + Math.sin(s.a) * orbitR, playerR * k * 0.8, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    if (state !== "dead") {
      const px = cx + Math.cos(ang) * orbitR, py = cy + Math.sin(ang) * orbitR;
      const g2 = ctx.createRadialGradient(px, py, 1, px, py, playerR * 3.4);
      g2.addColorStop(0, "rgba(255,93,115,0.45)");
      g2.addColorStop(1, "rgba(255,93,115,0)");
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(px, py, playerR * 3.4, 0, TAU); ctx.fill();
      if (flash > 0) {
        ctx.strokeStyle = "rgba(255,255,255," + flash * 0.7 + ")";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(px, py, playerR * (1.6 + (1 - flash) * 2.4), 0, TAU); ctx.stroke();
      }
      ctx.fillStyle = "#FF5D73";
      ctx.beginPath(); ctx.arc(px, py, playerR, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(255,235,240,0.9)";
      ctx.beginPath(); ctx.arc(px - playerR * 0.25, py - playerR * 0.28, playerR * 0.3, 0, TAU); ctx.fill();
    }

    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      ctx.fillStyle = "rgb(" + p.c + ")";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener("pointerdown", e => { e.preventDefault(); tap(); }, { passive: false });
  window.addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "ArrowLeft" || e.code === "ArrowRight" || e.code === "Enter") {
      e.preventDefault(); tap();
    }
  });
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 120));

  resize();
  requestAnimationFrame(frame);
})();
</script>
